<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <link rel="stylesheet" href="{{ url_for('admin:statics', path='css/tabler.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('admin:statics', path='css/tabler-icons.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('admin:statics', path='css/fontawesome.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('admin:statics', path='css/select2.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('admin:statics', path='css/flatpickr.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('admin:statics', path='css/main.css') }}">
  {% if admin.favicon_url %}
  <link rel="icon" href="{{ admin.favicon_url }}">
  {% endif %}
  {% block head %}
  {% endblock %}
  <title>{{ admin.title }}</title>
  <style>
    /* ── Global font & base ──────────────────────────────────────────────── */
    body {
      background: #f0f4f8;
      font-family: 'Inter', 'Segoe UI', sans-serif;
    }

    /* ── Sidebar / Navbar ────────────────────────────────────────────────── */
    .navbar-vertical.navbar-dark {
      background: linear-gradient(180deg, #0f172a 0%, #1e3a5f 60%, #1a4d7c 100%) !important;
      border-right: 1px solid rgba(255,255,255,0.06);
      box-shadow: 4px 0 20px rgba(0,0,0,0.25);
    }

    .navbar-vertical .navbar-brand h3 {
      color: #e2f0ff !important;
      font-weight: 800;
      font-size: 1.35rem;
      letter-spacing: 0.5px;
      padding: 4px 0;
      text-shadow: 0 1px 3px rgba(0,0,0,0.4);
    }

    .navbar-vertical .navbar-brand:hover h3 {
      color: #93c5fd !important;
    }

    /* Nav items */
    .navbar-vertical .nav-link {
      color: rgba(180, 210, 255, 0.82) !important;
      border-radius: 8px;
      margin: 2px 8px;
      padding: 8px 12px !important;
      transition: background 0.18s, color 0.18s;
      font-size: 0.875rem;
    }

    .navbar-vertical .nav-link:hover,
    .navbar-vertical .nav-item.active > .nav-link {
      background: rgba(96, 165, 250, 0.18) !important;
      color: #bfdbfe !important;
    }

    .navbar-vertical .nav-item.active > .nav-link {
      background: rgba(59, 130, 246, 0.28) !important;
      color: #93c5fd !important;
      font-weight: 600;
      border-left: 3px solid #3b82f6;
    }

    .navbar-vertical .nav-link .nav-link-icon,
    .navbar-vertical .nav-link i {
      color: #60a5fa !important;
    }

    /* Logout button */
    .navbar-vertical .btn-secondary {
      background: rgba(239, 68, 68, 0.15) !important;
      border: 1px solid rgba(239, 68, 68, 0.35) !important;
      color: #fca5a5 !important;
      border-radius: 8px;
      transition: all 0.18s;
    }
    .navbar-vertical .btn-secondary:hover {
      background: rgba(239, 68, 68, 0.3) !important;
      color: #fee2e2 !important;
    }

    /* ── Page wrapper ────────────────────────────────────────────────────── */
    .page-wrapper {
      background: #f0f4f8;
    }

    /* ── Page header ─────────────────────────────────────────────────────── */
    .page-header {
      background: linear-gradient(135deg, #1e3a5f 0%, #2563eb 100%);
      padding: 18px 24px !important;
      border-bottom: none;
      box-shadow: 0 2px 12px rgba(37,99,235,0.18);
    }

    .page-header .page-title {
      color: #fff !important;
      font-weight: 700;
      font-size: 1.3rem;
      margin: 0;
    }

    .page-header .page-pretitle {
      color: rgba(191,219,254,0.85) !important;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }

    /* ── Cards ───────────────────────────────────────────────────────────── */
    .card {
      border: none;
      border-radius: 12px !important;
      box-shadow: 0 2px 12px rgba(30,58,95,0.10) !important;
      overflow: hidden;
    }

    .card-header {
      background: linear-gradient(90deg, #1e3a5f 0%, #1d4ed8 100%) !important;
      border-bottom: none !important;
      padding: 14px 20px !important;
    }

    .card-header h3,
    .card-header .card-title {
      color: #fff !important;
      font-weight: 700;
      font-size: 1rem;
    }

    /* ── Table ───────────────────────────────────────────────────────────── */
    .table-responsive {
      border-radius: 0 0 12px 12px;
      overflow: hidden;
    }

    .table thead th {
      background: #1e3a5f !important;
      color: #bfdbfe !important;
      font-weight: 600;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.7px;
      border: none !important;
      padding: 12px 16px !important;
    }

    .table thead th a {
      color: #93c5fd !important;
      text-decoration: none;
    }
    .table thead th a:hover {
      color: #dbeafe !important;
    }

    .table tbody tr {
      transition: background 0.15s;
      border-bottom: 1px solid #e5eaf2 !important;
    }

    .table tbody tr:hover {
      background: #eff6ff !important;
    }

    .table tbody td {
      vertical-align: middle;
      font-size: 0.875rem;
      color: #1e293b;
      padding: 11px 16px !important;
      border: none !important;
      /* Cho phep noi dung dai xuong dong, tranh keo bang qua phai */
      white-space: normal !important;
      word-break: break-word;
      overflow-wrap: anywhere;
      max-width: 720px;
    }

    /* Cot ID/PK ngan giu nguyen 1 dong */
    .table tbody td.column-id,
    .table tbody td.action-column,
    .table tbody td:first-child {
      white-space: nowrap !important;
      max-width: none;
    }

    /* Striped rows */
    .table-striped tbody tr:nth-of-type(odd) {
      background: #f8faff;
    }

    /* ── Buttons ─────────────────────────────────────────────────────────── */
    .btn-primary {
      background: linear-gradient(135deg, #2563eb, #1d4ed8) !important;
      border: none !important;
      border-radius: 8px !important;
      font-weight: 600;
      box-shadow: 0 2px 8px rgba(37,99,235,0.3);
      transition: all 0.18s;
    }
    .btn-primary:hover {
      background: linear-gradient(135deg, #1d4ed8, #1e40af) !important;
      box-shadow: 0 4px 14px rgba(37,99,235,0.45);
      transform: translateY(-1px);
    }

    .btn-secondary {
      border-radius: 8px !important;
      font-weight: 600;
      transition: all 0.15s;
    }

    .btn-danger {
      background: linear-gradient(135deg, #ef4444, #dc2626) !important;
      border: none !important;
      border-radius: 8px !important;
      font-weight: 600;
    }

    /* Action icons in list */
    .table .btn-sm {
      width: 28px;
      height: 28px;
      padding: 0 !important;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px !important;
      font-size: 0.78rem;
    }

    /* View (eye) icon */
    a.btn-sm[href*="/detail/"] { background: #e0f2fe !important; color: #0369a1 !important; border: none !important; }
    a.btn-sm[href*="/detail/"]:hover { background: #bae6fd !important; }

    /* Edit icon */
    a.btn-sm[href*="/edit/"] { background: #fef9c3 !important; color: #854d0e !important; border: none !important; }
    a.btn-sm[href*="/edit/"]:hover { background: #fef08a !important; }

    /* Delete button */
    button.btn-sm.btn-danger, form button.btn-sm { background: #fee2e2 !important; color: #b91c1c !important; border: none !important; }
    button.btn-sm.btn-danger:hover, form button.btn-sm:hover { background: #fecaca !important; }

    /* ── Search bar ──────────────────────────────────────────────────────── */
    .input-group .form-control {
      border-radius: 8px 0 0 8px !important;
      border: 1.5px solid #cbd5e1 !important;
      font-size: 0.875rem;
    }
    .input-group .btn {
      border-radius: 0 8px 8px 0 !important;
    }

    /* ── Pagination ──────────────────────────────────────────────────────── */
    .pagination .page-link {
      border-radius: 6px !important;
      margin: 0 2px;
      font-weight: 500;
      color: #1d4ed8;
      border: 1.5px solid #dbeafe;
      transition: all 0.15s;
    }
    .pagination .page-link:hover {
      background: #2563eb !important;
      color: #fff !important;
      border-color: #2563eb !important;
    }
    .pagination .page-item.active .page-link {
      background: #2563eb !important;
      border-color: #2563eb !important;
      color: #fff !important;
    }

    /* ── Detail view ─────────────────────────────────────────────────────── */
    .datagrid-title {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.7px;
      color: #64748b;
      font-weight: 700;
    }

    .datagrid-content {
      color: #0f172a;
      font-size: 0.9rem;
    }

    /* ── Form inputs ─────────────────────────────────────────────────────── */
    .form-control, .form-select {
      border-radius: 8px !important;
      border: 1.5px solid #cbd5e1 !important;
      font-size: 0.875rem;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .form-control:focus, .form-select:focus {
      border-color: #3b82f6 !important;
      box-shadow: 0 0 0 3px rgba(59,130,246,0.15) !important;
    }

    /* ── Export / Actions dropdown ───────────────────────────────────────── */
    .dropdown-menu {
      border-radius: 10px !important;
      border: 1px solid #e2e8f0 !important;
      box-shadow: 0 8px 24px rgba(0,0,0,0.12) !important;
      padding: 6px !important;
    }
    .dropdown-item {
      border-radius: 6px !important;
      font-size: 0.875rem;
      padding: 8px 14px !important;
      transition: background 0.12s;
    }
    .dropdown-item:hover {
      background: #eff6ff !important;
      color: #1d4ed8 !important;
    }

    /* ── Checkbox ────────────────────────────────────────────────────────── */
    .form-check-input:checked {
      background-color: #2563eb !important;
      border-color: #2563eb !important;
    }

    /* ── Scrollbar ───────────────────────────────────────────────────────── */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #64748b; }
  </style>
</head>

<body>
  {% block body %}
  <main>
    {% block main %}
    {% endblock %}
  </main>
  {% endblock %}
  <script type="text/javascript" src="{{ url_for('admin:statics', path='js/jquery.min.js') }}"></script>
  <script type="text/javascript" src="{{ url_for('admin:statics', path='js/tabler.min.js') }}"></script>
  <script type="text/javascript" src="{{ url_for('admin:statics', path='js/popper.min.js') }}"></script>
  <script type="text/javascript" src="{{ url_for('admin:statics', path='js/bootstrap.min.js') }}"></script>
  <script type="text/javascript" src="{{ url_for('admin:statics', path='js/select2.full.min.js') }}"></script>
  <script type="text/javascript" src="{{ url_for('admin:statics', path='js/flatpickr.min.js') }}"></script>
  <script type="text/javascript" src="{{ url_for('admin:statics', path='js/main.js') }}"></script>
  <script>
    /* ── Format so co dau cham phan cach ngan (kieu Viet Nam) ─────────────
       Vi du: "Showing 1 to 25 of 17430 items" -> "Showing 1 to 25 of 17.430 items"
       Ap dung cho TAT CA cac trang admin (chan trang pagination, count badge, ...).
    */
    (function () {
      function fmtVN(n) {
        return Number(n).toLocaleString('vi-VN');
      }
      function formatNumbersIn(root) {
        var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
        var nodes = [];
        var node;
        while ((node = walker.nextNode())) {
          var text = node.nodeValue;
          if (!text) continue;
          /* Chi format text co tu khoa "items" / "rows" / "results"
             de tranh dung cham toi ID, ngay thang, hay so trong noi dung khac. */
          if (/\b\d{4,}\b/.test(text) && /(items|rows|results)\b/i.test(text)) {
            nodes.push(node);
          }
        }
        nodes.forEach(function (n) {
          n.nodeValue = n.nodeValue.replace(/\b(\d{4,})\b/g, function (m) {
            return fmtVN(m);
          });
        });
      }
      function run() { formatNumbersIn(document.body); }
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', run);
      } else {
        run();
      }
    })();
  </script>
  {% block tail %}
  {% endblock %}
</body>

</html>
