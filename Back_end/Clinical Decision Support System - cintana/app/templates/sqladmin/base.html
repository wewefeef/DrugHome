<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <link rel="stylesheet" href="{{ url_for('admin:statics', path='css/tabler.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('admin:statics', path='css/tabler-icons.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('admin:statics', path='css/fontawesome.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('admin:statics', path='css/select2.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('admin:statics', path='css/flatpickr.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('admin:statics', path='css/main.css') }}">
  {% if admin.favicon_url %}
  <link rel="icon" href="{{ admin.favicon_url }}">
  {% endif %}
  {% block head %}
  {% endblock %}
  <title>{{ admin.title }}</title>
  <style>
    /* ── Global font & base ──────────────────────────────────────────────── */
    body {
      background: #f0f4f8;
      font-family: 'Inter', 'Segoe UI', sans-serif;
    }

    /* ── Sidebar / Navbar ────────────────────────────────────────────────── */
    .navbar-vertical.navbar-dark {
      background: linear-gradient(180deg, #0f172a 0%, #1e3a5f 60%, #1a4d7c 100%) !important;
      border-right: 1px solid rgba(255,255,255,0.06);
      box-shadow: 4px 0 20px rgba(0,0,0,0.25);
    }

    .navbar-vertical .navbar-brand h3 {
      color: #e2f0ff !important;
      font-weight: 800;
      font-size: 1.35rem;
      letter-spacing: 0.5px;
      padding: 4px 0;
      text-shadow: 0 1px 3px rgba(0,0,0,0.4);
    }

    .navbar-vertical .navbar-brand:hover h3 {
      color: #93c5fd !important;
    }

    /* Nav items */
    .navbar-vertical .nav-link {
      color: rgba(180, 210, 255, 0.82) !important;
      border-radius: 8px;
      margin: 2px 8px;
      padding: 8px 12px !important;
      transition: background 0.18s, color 0.18s;
      font-size: 0.875rem;
    }

    .navbar-vertical .nav-link:hover,
    .navbar-vertical .nav-item.active > .nav-link {
      background: rgba(96, 165, 250, 0.18) !important;
      color: #bfdbfe !important;
    }

    .navbar-vertical .nav-item.active > .nav-link {
      background: rgba(59, 130, 246, 0.28) !important;
      color: #93c5fd !important;
      font-weight: 600;
      border-left: 3px solid #3b82f6;
    }

    .navbar-vertical .nav-link .nav-link-icon,
    .navbar-vertical .nav-link i {
      color: #60a5fa !important;
    }

    /* Logout button */
    .navbar-vertical .btn-secondary {
      background: rgba(239, 68, 68, 0.15) !important;
      border: 1px solid rgba(239, 68, 68, 0.35) !important;
      color: #fca5a5 !important;
      border-radius: 8px;
      transition: all 0.18s;
    }
    .navbar-vertical .btn-secondary:hover {
      background: rgba(239, 68, 68, 0.3) !important;
      color: #fee2e2 !important;
    }

    /* ── Page wrapper ────────────────────────────────────────────────────── */
    .page-wrapper {
      background: #f0f4f8;
    }

    /* ── Page header ─────────────────────────────────────────────────────── */
    .page-header {
      background: linear-gradient(135deg, #1e3a5f 0%, #2563eb 100%);
      padding: 18px 24px !important;
      border-bottom: none;
      box-shadow: 0 2px 12px rgba(37,99,235,0.18);
    }

    .page-header .page-title {
      color: #fff !important;
      font-weight: 700;
      font-size: 1.3rem;
      margin: 0;
    }

    .page-header .page-pretitle {
      color: rgba(191,219,254,0.85) !important;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }

    /* ── Cards ───────────────────────────────────────────────────────────── */
    .card {
      border: none;
      border-radius: 12px !important;
      box-shadow: 0 2px 12px rgba(30,58,95,0.10) !important;
      overflow: hidden;
    }

    .card-header {
      background: linear-gradient(90deg, #1e3a5f 0%, #1d4ed8 100%) !important;
      border-bottom: none !important;
      padding: 14px 20px !important;
    }

    .card-header h3,
    .card-header .card-title {
      color: #fff !important;
      font-weight: 700;
      font-size: 1rem;
    }

    /* ── Table ───────────────────────────────────────────────────────────── */
    .table-responsive {
      border-radius: 0 0 12px 12px;
      overflow: hidden;
    }

    .table thead th {
      background: #1e3a5f !important;
      color: #bfdbfe !important;
      font-weight: 600;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.7px;
      border: none !important;
      padding: 12px 16px !important;
    }

    .table thead th a {
      color: #93c5fd !important;
      text-decoration: none;
    }
    .table thead th a:hover {
      color: #dbeafe !important;
    }

    .table tbody tr {
      transition: background 0.15s;
      border-bottom: 1px solid #e5eaf2 !important;
    }

    .table tbody tr:hover {
      background: #eff6ff !important;
    }

    .table tbody td {
      vertical-align: middle;
      font-size: 0.875rem;
      color: #1e293b;
      padding: 11px 16px !important;
      border: none !important;
      /* Cho phep noi dung dai xuong dong THEO TU (khong cat giua tu) */
      white-space: normal !important;
      overflow-wrap: break-word;
      word-wrap: break-word;
      min-width: 80px;
    }

    /* ── Action column (cell thu 2 — chua icon view/edit/delete) ──────────
       Bat buoc xep NGANG, khong duoc xuong dong, khong wrap.
       Cell 1 la checkbox, cell 2 la action — chuan cua sqladmin. */
    .table thead th:nth-child(2),
    .table tbody td:nth-child(2) {
      white-space: nowrap !important;
      overflow-wrap: normal !important;
      word-wrap: normal !important;
      width: 1%;
      min-width: 110px;
      vertical-align: middle !important;
    }

    /* Buttons + form trong action cell phai inline ngang nhau */
    .table tbody td:nth-child(2) > a,
    .table tbody td:nth-child(2) > form,
    .table tbody td:nth-child(2) > button {
      display: inline-flex !important;
      vertical-align: middle !important;
      margin: 0 1px !important;
      float: none !important;
    }

    .table tbody td:nth-child(2) > form {
      display: inline-block !important;
    }

    .table tbody td:nth-child(2) > form > button {
      display: inline-flex !important;
    }

    /* Cot ID/PK ngan giu nguyen 1 dong */
    .table tbody td.column-id,
    .table tbody td:first-child {
      white-space: nowrap !important;
    }

    /* Khi cot text qua dai (Notes, Description, ...) gay overflow,
       table-responsive cua sqladmin tu cuon ngang — khong ep wrap aggressive. */
    .table-responsive { overflow-x: auto; }

    /* Striped rows */
    .table-striped tbody tr:nth-of-type(odd) {
      background: #f8faff;
    }

    /* ── Buttons ─────────────────────────────────────────────────────────── */
    .btn-primary {
      background: linear-gradient(135deg, #2563eb, #1d4ed8) !important;
      border: none !important;
      border-radius: 8px !important;
      font-weight: 600;
      box-shadow: 0 2px 8px rgba(37,99,235,0.3);
      transition: all 0.18s;
    }
    .btn-primary:hover {
      background: linear-gradient(135deg, #1d4ed8, #1e40af) !important;
      box-shadow: 0 4px 14px rgba(37,99,235,0.45);
      transform: translateY(-1px);
    }

    .btn-secondary {
      border-radius: 8px !important;
      font-weight: 600;
      transition: all 0.15s;
    }

    .btn-danger {
      background: linear-gradient(135deg, #ef4444, #dc2626) !important;
      border: none !important;
      border-radius: 8px !important;
      font-weight: 600;
    }

    /* Action icons in list */
    .table .btn-sm {
      width: 28px;
      height: 28px;
      padding: 0 !important;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px !important;
      font-size: 0.78rem;
    }

    /* View (eye) icon */
    a.btn-sm[href*="/detail/"] { background: #e0f2fe !important; color: #0369a1 !important; border: none !important; }
    a.btn-sm[href*="/detail/"]:hover { background: #bae6fd !important; }

    /* Edit icon */
    a.btn-sm[href*="/edit/"] { background: #fef9c3 !important; color: #854d0e !important; border: none !important; }
    a.btn-sm[href*="/edit/"]:hover { background: #fef08a !important; }

    /* Delete button */
    button.btn-sm.btn-danger, form button.btn-sm { background: #fee2e2 !important; color: #b91c1c !important; border: none !important; }
    button.btn-sm.btn-danger:hover, form button.btn-sm:hover { background: #fecaca !important; }

    /* ── Search bar ──────────────────────────────────────────────────────── */
    .input-group .form-control {
      border-radius: 8px 0 0 8px !important;
      border: 1.5px solid #cbd5e1 !important;
      font-size: 0.875rem;
    }
    .input-group .btn {
      border-radius: 0 8px 8px 0 !important;
    }

    /* ── Pagination ──────────────────────────────────────────────────────── */
    .pagination .page-link {
      border-radius: 6px !important;
      margin: 0 2px;
      font-weight: 500;
      color: #1d4ed8;
      border: 1.5px solid #dbeafe;
      transition: all 0.15s;
    }
    .pagination .page-link:hover {
      background: #2563eb !important;
      color: #fff !important;
      border-color: #2563eb !important;
    }
    .pagination .page-item.active .page-link {
      background: #2563eb !important;
      border-color: #2563eb !important;
      color: #fff !important;
    }

    /* ── Detail view ─────────────────────────────────────────────────────── */
    .datagrid-title {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.7px;
      color: #64748b;
      font-weight: 700;
    }

    .datagrid-content {
      color: #0f172a;
      font-size: 0.9rem;
    }

    /* ── Form inputs ─────────────────────────────────────────────────────── */
    .form-control, .form-select {
      border-radius: 8px !important;
      border: 1.5px solid #cbd5e1 !important;
      font-size: 0.875rem;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .form-control:focus, .form-select:focus {
      border-color: #3b82f6 !important;
      box-shadow: 0 0 0 3px rgba(59,130,246,0.15) !important;
    }

    /* ── Export / Actions dropdown ───────────────────────────────────────── */
    .dropdown-menu {
      border-radius: 10px !important;
      border: 1px solid #e2e8f0 !important;
      box-shadow: 0 8px 24px rgba(0,0,0,0.12) !important;
      padding: 6px !important;
    }
    .dropdown-item {
      border-radius: 6px !important;
      font-size: 0.875rem;
      padding: 8px 14px !important;
      transition: background 0.12s;
    }
    .dropdown-item:hover {
      background: #eff6ff !important;
      color: #1d4ed8 !important;
    }

    /* ── Checkbox ────────────────────────────────────────────────────────── */
    .form-check-input:checked {
      background-color: #2563eb !important;
      border-color: #2563eb !important;
    }

    /* ── Scrollbar ───────────────────────────────────────────────────────── */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #64748b; }
  </style>
</head>

<body>
  {% block body %}
  <main>
    {% block main %}
    {% endblock %}
  </main>
  {% endblock %}
  <script type="text/javascript" src="{{ url_for('admin:statics', path='js/jquery.min.js') }}"></script>
  <script type="text/javascript" src="{{ url_for('admin:statics', path='js/tabler.min.js') }}"></script>
  <script type="text/javascript" src="{{ url_for('admin:statics', path='js/popper.min.js') }}"></script>
  <script type="text/javascript" src="{{ url_for('admin:statics', path='js/bootstrap.min.js') }}"></script>
  <script type="text/javascript" src="{{ url_for('admin:statics', path='js/select2.full.min.js') }}"></script>
  <script type="text/javascript" src="{{ url_for('admin:statics', path='js/flatpickr.min.js') }}"></script>
  <script type="text/javascript" src="{{ url_for('admin:statics', path='js/main.js') }}"></script>
  <script>
    /* ── Inject Wizard button on Drug list page ────────────────────────────
       Trang /admin/drug/list: thêm nút "+ Thêm thuốc (Wizard)" cạnh nút "+ New Drug"
    */
    (function () {
      function injectWizardBtn() {
        var url = window.location.pathname;
        if (url.indexOf('/admin/drug/list') === -1 && url !== '/admin/drug/list') return;
        var newBtn = document.querySelector('a[href*="/admin/drug/create"]');
        if (!newBtn || document.getElementById('wizard-drug-btn')) return;
        var btn = document.createElement('a');
        btn.id = 'wizard-drug-btn';
        btn.href = '/admin/wizard/drug/new';
        btn.innerHTML = '<i class="fa-solid fa-wand-magic-sparkles"></i> Thêm thuốc (Wizard)';
        btn.style.cssText = [
          'display:inline-flex','align-items:center','gap:7px',
          'padding:8px 18px','border-radius:8px','font-weight:700','font-size:.875rem',
          'background:linear-gradient(135deg,#7c3aed,#4f46e5)',
          'color:#fff','text-decoration:none','margin-right:8px',
          'box-shadow:0 2px 8px rgba(124,58,237,.35)',
          'transition:all .18s',
        ].join(';');
        btn.onmouseover = function(){ this.style.opacity='0.88'; };
        btn.onmouseout  = function(){ this.style.opacity='1'; };
        newBtn.parentNode.insertBefore(btn, newBtn);
      }
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', injectWizardBtn);
      else injectWizardBtn();
    })();
  </script>
  <script>
    /* ── Format so co dau phay phan cach ngan (kieu en-US) ────────────────
       Vi du:
         "Showing 1 to 50 of 2855848 items" -> "Showing 1 to 50 of 2,855,848 items"
         "Showing 1 to 25 of 17430 items"   -> "Showing 1 to 25 of 17,430 items"
       Ap dung cho TAT CA cac trang admin (chan trang pagination, count badge, ...).
    */
    (function () {
      function fmt(n) { return Number(n).toLocaleString('en-US'); }

      var SKIP_TAGS = { SCRIPT: 1, STYLE: 1, CODE: 1, PRE: 1, INPUT: 1, TEXTAREA: 1 };

      function shouldSkipParent(node) {
        var p = node.parentNode;
        while (p && p !== document.body) {
          if (SKIP_TAGS[p.tagName]) return true;
          /* Bo qua text trong link "edit/123" — khong format ID URL */
          if (p.tagName === 'A' && /\/(detail|edit|delete)\//.test(p.getAttribute('href') || '')) return true;
          p = p.parentNode;
        }
        return false;
      }

      function formatTextNode(n) {
        var text = n.nodeValue;
        if (!text) return;
        /* Tim text co dang "Showing ... of N items|rows|results" hoac
           text khac chua "Page X of Y" — format moi so >=4 chu so bang dau phay,
           NGOAI TRU so dang ngay thang YYYY-MM-DD va so dang DBxxxxx. */
        var hasIndicator = /\b(showing|of|page|total|count|items|rows|results|records)\b/i.test(text);
        var hasBigNum    = /\b\d{4,}\b/.test(text);
        if (!hasIndicator || !hasBigNum) return;
        if (shouldSkipParent(n)) return;

        var newText = text.replace(/\b(\d{4,})\b/g, function (m, num, offset, full) {
          /* Bo qua nam (4 chu so) khi nam ngay sat dau "-" o sau (YYYY-MM-DD) */
          var after = full.charAt(offset + num.length);
          if (after === '-' && num.length === 4) return num;
          /* Bo qua so da co dau phay roi (1,234) */
          var before = full.charAt(offset - 1);
          if (before === ',' || before === '.') return num;
          return fmt(num);
        });
        if (newText !== text) n.nodeValue = newText;
      }

      function scan(root) {
        var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
        var batch = [];
        var node;
        while ((node = walker.nextNode())) batch.push(node);
        batch.forEach(formatTextNode);
      }

      function run() {
        scan(document.body);
        /* Chay them 2 lan sau khi async/template render xong */
        setTimeout(function () { scan(document.body); }, 250);
        setTimeout(function () { scan(document.body); }, 1000);
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', run);
      } else {
        run();
      }

      /* Re-format khi DOM thay doi (sau search/filter/AJAX pagination) */
      try {
        var observer = new MutationObserver(function (mutations) {
          for (var i = 0; i < mutations.length; i++) {
            var m = mutations[i];
            for (var j = 0; j < m.addedNodes.length; j++) {
              var n = m.addedNodes[j];
              if (n.nodeType === 1) scan(n);
              else if (n.nodeType === 3) formatTextNode(n);
            }
          }
        });
        observer.observe(document.body, { childList: true, subtree: true });
      } catch (e) { /* ignore */ }
    })();
  </script>
  {% block tail %}
  {% endblock %}
</body>

</html>
