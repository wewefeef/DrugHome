<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MediDB — Admin Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --blue: #3b82f6;
            --blue-dark: #1d4ed8;
            --green: #10b981;
            --navy: #0f172a;
            --card-bg: rgba(255,255,255,0.04);
            --border: rgba(255,255,255,0.1);
            --text: #f1f5f9;
            --muted: #94a3b8;
        }

        html, body {
            height: 100%;
            font-family: 'Inter', system-ui, sans-serif;
        }

        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #060c18;
            overflow: hidden;
            position: relative;
        }

        /* ── Animated mesh background ── */
        .bg-mesh {
            position: fixed;
            inset: 0;
            z-index: 0;
            background:
                radial-gradient(ellipse 80% 60% at 20% 10%, rgba(59,130,246,0.18) 0%, transparent 55%),
                radial-gradient(ellipse 60% 50% at 80% 80%, rgba(16,185,129,0.14) 0%, transparent 55%),
                radial-gradient(ellipse 50% 40% at 50% 50%, rgba(139,92,246,0.08) 0%, transparent 60%);
            animation: meshMove 12s ease-in-out infinite alternate;
        }

        @keyframes meshMove {
            from { transform: scale(1) rotate(0deg); }
            to   { transform: scale(1.1) rotate(3deg); }
        }

        /* ── Floating particles ── */
        .particles { position: fixed; inset: 0; z-index: 0; overflow: hidden; }
        .particle {
            position: absolute;
            border-radius: 50%;
            background: rgba(59,130,246,0.35);
            animation: float linear infinite;
        }
        .particle:nth-child(1)  { width:3px; height:3px; left:10%;  animation-duration:18s; animation-delay:0s;   }
        .particle:nth-child(2)  { width:4px; height:4px; left:25%;  animation-duration:22s; animation-delay:3s;   background:rgba(16,185,129,0.4); }
        .particle:nth-child(3)  { width:2px; height:2px; left:40%;  animation-duration:15s; animation-delay:6s;   }
        .particle:nth-child(4)  { width:5px; height:5px; left:60%;  animation-duration:25s; animation-delay:1s;   background:rgba(139,92,246,0.35); }
        .particle:nth-child(5)  { width:3px; height:3px; left:75%;  animation-duration:20s; animation-delay:8s;   }
        .particle:nth-child(6)  { width:2px; height:2px; left:88%;  animation-duration:17s; animation-delay:4s;   background:rgba(16,185,129,0.4); }

        @keyframes float {
            0%   { transform: translateY(110vh) scale(0); opacity: 0; }
            10%  { opacity: 1; }
            90%  { opacity: 1; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }

        /* ── Card ── */
        .card {
            position: relative;
            z-index: 10;
            width: min(440px, calc(100vw - 32px));
            background: var(--card-bg);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 48px 44px 40px;
            box-shadow:
                0 0 0 1px rgba(255,255,255,0.04) inset,
                0 32px 64px rgba(0,0,0,0.6),
                0 8px 16px rgba(0,0,0,0.3);
            animation: cardIn 0.6s cubic-bezier(0.16,1,0.3,1) both;
        }

        @keyframes cardIn {
            from { opacity:0; transform: translateY(24px) scale(0.97); }
            to   { opacity:1; transform: translateY(0) scale(1); }
        }

        /* Glow ring around card */
        .card::before {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: 25px;
            background: linear-gradient(135deg, rgba(59,130,246,0.3), rgba(16,185,129,0.2), transparent, transparent);
            z-index: -1;
        }

        /* ── Brand ── */
        .brand { text-align: center; margin-bottom: 40px; }

        .brand-logo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 76px; height: 76px;
            background: linear-gradient(135deg, #1e40af 0%, #3b82f6 50%, #10b981 100%);
            border-radius: 20px;
            margin-bottom: 18px;
            box-shadow: 0 8px 32px rgba(59,130,246,0.45), 0 0 0 1px rgba(255,255,255,0.1) inset;
            position: relative;
            animation: logoPulse 3s ease-in-out infinite;
        }

        @keyframes logoPulse {
            0%, 100% { box-shadow: 0 8px 32px rgba(59,130,246,0.45), 0 0 0 1px rgba(255,255,255,0.1) inset; }
            50%       { box-shadow: 0 8px 48px rgba(59,130,246,0.65), 0 0 0 1px rgba(255,255,255,0.1) inset; }
        }

        .brand-logo i { font-size: 32px; color: #fff; }

        .brand-name {
            font-size: 28px;
            font-weight: 800;
            color: var(--text);
            letter-spacing: -0.8px;
            line-height: 1;
            margin-bottom: 6px;
        }
        .brand-name span { color: var(--blue); }

        .brand-tagline {
            font-size: 12px;
            font-weight: 500;
            color: var(--muted);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* ── Divider ── */
        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 28px;
            color: rgba(148,163,184,0.4);
            font-size: 12px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        /* ── Error ── */
        .alert {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(239,68,68,0.12);
            border: 1px solid rgba(239,68,68,0.25);
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 24px;
            color: #fca5a5;
            font-size: 13.5px;
            font-weight: 500;
            animation: shake 0.4s ease;
        }
        .alert i { color: #f87171; font-size: 16px; flex-shrink:0; }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%       { transform: translateX(-6px); }
            40%       { transform: translateX(6px); }
            60%       { transform: translateX(-4px); }
            80%       { transform: translateX(4px); }
        }

        /* ── Form ── */
        .field { margin-bottom: 18px; }

        .field label {
            display: block;
            font-size: 12.5px;
            font-weight: 600;
            color: rgba(203,213,225,0.8);
            margin-bottom: 8px;
            letter-spacing: 0.4px;
            text-transform: uppercase;
        }

        .input-wrap {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            color: rgba(148,163,184,0.5);
            font-size: 15px;
            pointer-events: none;
            transition: color 0.2s;
        }

        .input-wrap:focus-within .input-icon { color: var(--blue); }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 13px 14px 13px 44px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            color: var(--text);
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: all 0.2s;
            -webkit-appearance: none;
        }

        input::placeholder { color: rgba(148,163,184,0.4); }

        input:focus {
            border-color: rgba(59,130,246,0.6);
            background: rgba(59,130,246,0.07);
            box-shadow: 0 0 0 3px rgba(59,130,246,0.12);
        }

        .eye-toggle {
            position: absolute;
            right: 14px;
            background: none;
            border: none;
            color: rgba(148,163,184,0.4);
            cursor: pointer;
            font-size: 15px;
            padding: 0;
            transition: color 0.2s;
        }
        .eye-toggle:hover { color: var(--muted); }

        /* ── Submit ── */
        .btn-submit {
            width: 100%;
            margin-top: 8px;
            padding: 14px;
            background: linear-gradient(135deg, #2563eb 0%, #3b82f6 100%);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-family: inherit;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            letter-spacing: 0.3px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 16px rgba(37,99,235,0.4);
            position: relative;
            overflow: hidden;
        }

        .btn-submit::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.12), transparent);
            transform: translateX(-100%);
            transition: transform 0.5s;
        }

        .btn-submit:hover::after { transform: translateX(100%); }

        .btn-submit:hover {
            background: linear-gradient(135deg, #1d4ed8 0%, #2563eb 100%);
            transform: translateY(-1px);
            box-shadow: 0 6px 24px rgba(37,99,235,0.55);
        }

        .btn-submit:active { transform: translateY(0); }

        /* ── Stats ── */
        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1px;
            margin-top: 32px;
            background: var(--border);
            border-radius: 14px;
            overflow: hidden;
        }

        .stat {
            background: rgba(255,255,255,0.025);
            padding: 14px 8px;
            text-align: center;
            transition: background 0.2s;
        }
        .stat:hover { background: rgba(255,255,255,0.05); }

        .stat-val {
            font-size: 16px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--blue), var(--green));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.2;
        }

        .stat-lbl {
            font-size: 10.5px;
            color: rgba(100,116,139,0.8);
            margin-top: 3px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* ── Footer ── */
        .footer {
            text-align: center;
            margin-top: 24px;
            font-size: 12px;
            color: rgba(71,85,105,0.8);
        }
        .footer a {
            color: rgba(148,163,184,0.6);
            text-decoration: none;
            transition: color 0.2s;
        }
        .footer a:hover { color: var(--muted); }
    </style>
</head>
<body>
    <div class="bg-mesh"></div>
    <div class="particles">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>

    <div class="card">
        <div class="brand">
            <div class="brand-logo">
                <i class="fa-solid fa-shield-halved"></i>
            </div>
            <div class="brand-name">Medi<span>DB</span></div>
            <div class="brand-tagline">Admin Control Panel</div>
        </div>

        {% if error %}
        <div class="alert">
            <i class="fa-solid fa-circle-exclamation"></i>
            Incorrect username or password. Try again.
        </div>
        {% endif %}

        <div class="divider">Secure Sign-In</div>

        <form method="POST" action="{{ url_for('admin:login') }}" autocomplete="off">
            <div class="field">
                <label for="username">Username</label>
                <div class="input-wrap">
                    <i class="fa-solid fa-user input-icon"></i>
                    <input type="text" id="username" name="username"
                           placeholder="Enter admin username"
                           autocomplete="username" autofocus required />
                </div>
            </div>

            <div class="field">
                <label for="password">Password</label>
                <div class="input-wrap">
                    <i class="fa-solid fa-lock input-icon"></i>
                    <input type="password" id="password" name="password"
                           placeholder="Enter admin password"
                           autocomplete="current-password" required />
                    <button type="button" class="eye-toggle" onclick="togglePwd()" id="eyeBtn">
                        <i class="fa-regular fa-eye" id="eyeIcon"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn-submit">
                <i class="fa-solid fa-right-to-bracket"></i>
                Sign In to Admin Panel
            </button>
        </form>

        <div class="stats">
            <div class="stat">
                <div class="stat-val">14</div>
                <div class="stat-lbl">DB Tables</div>
            </div>
            <div class="stat">
                <div class="stat-val">11K+</div>
                <div class="stat-lbl">Drugs</div>
            </div>
            <div class="stat">
                <div class="stat-val">1.3M+</div>
                <div class="stat-lbl">Interactions</div>
            </div>
        </div>

        <div class="footer">
            Clinical Decision Support System &copy; 2025
            &nbsp;·&nbsp;
            <a href="/">&#8592; Main Website</a>
        </div>
    </div>

    <script>
        function togglePwd() {
            const input = document.getElementById('password');
            const icon  = document.getElementById('eyeIcon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }
    </script>
</body>
</html>
